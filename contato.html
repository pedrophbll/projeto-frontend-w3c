<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>ONG Conecta | Contato</title></head><body><a class="skip" href="#conteudo">Ir para o conteúdo</a><header><div class="container"><h1>ONG Conecta</h1><nav aria-label="Navegação principal"><a href="index.html">Início</a><a href="projetos.html">Projetos</a><a aria-current="page" href="contato.html">Contato</a></nav><button id="theme" type="button" aria-pressed="false" aria-label="Alternar modo escuro">Modo escuro</button></div></header><main id="conteudo" class="container"><h2>Entre em contato</h2><p>Preencha o formulário para demonstrar interesse em voluntariado, doações ou projetos.</p><form id="contactForm"><label for="nome">Nome *</label><input id="nome" name="nome" required minlength="3" autocomplete="name" aria-required="true"><label for="email">E-mail *</label><input id="email" name="email" type="email" required autocomplete="email" aria-required="true"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" inputmode="tel" pattern="[0-9 ()+\-]{8,20}" autocomplete="tel" aria-describedby="tel-ajuda"><small id="tel-ajuda">Use apenas números, espaços, parênteses, + ou -.</small><label for="assunto">Assunto *</label><select id="assunto" name="assunto" required aria-required="true"><option value="">Selecione</option><option>Voluntariado</option><option>Doação</option><option>Projetos</option></select><label for="mensagem">Mensagem *</label><textarea id="mensagem" name="mensagem" rows="6" required minlength="10" aria-required="true"></textarea><button type="submit">Enviar mensagem</button><p id="status" role="status" aria-live="polite"></p></form></main><footer><div class="container"><p>© 2026 ONG Conecta — Projeto académico.</p></div></footer><script src="js/script.js"></script></body></html>
